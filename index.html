<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ToolBelt AR</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#f3f3f3;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

model-viewer{
width:100%;
height:100vh;
}

</style>

</head>

<body>

<model-viewer

src="toolbelt_icon_v3.glb"

camera-controls

auto-rotate

shadow-intensity="1"

ar

ar-modes="webxr scene-viewer quick-look"

>

<button slot="ar-button">

🚀 Place ToolBelt in your space

</button>

</model-viewer>

</body>

</html>
